# NewTerraForged — biome ↔ terrain integration
# Restrict which surface biomes may spawn on each landform terrain.
#
# Terrains: steppe, plains, hills_1, hills_2, dales, plateau, badlands, torridonian,
#           mountains_1, mountains_2, mountains_3, dolomites, mountains_ridge_1, mountains_ridge_2
#
# whitelist — if non-empty, ONLY these biomes may appear on this terrain (from the climate pool).
# blacklist — these biomes never appear on this terrain.
#
# Badlands / mesa biomes belong on the badlands terrain only — they paint terracotta bands on slopes elsewhere.

[steppe]
blacklist = [
  "minecraft:badlands",
  "minecraft:wooded_badlands",
  "minecraft:eroded_badlands",
  "terralith:savanna_badlands",
  "terralith:snowy_badlands",
  "terralith:warped_mesa",
  "terralith:white_mesa",
  "byg:sierra_badlands",
  "regions_unexplored:outback",
  "minecraft:beach",
  "minecraft:stony_shore",
  "minecraft:snowy_beach",
  "minecraft:jungle",
  "minecraft:sparse_jungle",
  "minecraft:bamboo_jungle",
]

