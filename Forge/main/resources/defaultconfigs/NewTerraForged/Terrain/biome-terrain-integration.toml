# NewTerraForged вЂ” biome в†” terrain integration
# Autogenerated by scripts/apply-biome-terrain-review.ps1 вЂ” edit rule sets there, then re-apply.
# Groups expand via TerrainGroup at load (nested TOML [group.plains] is supported).
#
# whitelist вЂ” if non-empty, ONLY these biomes may appear on this terrain.
# blacklist вЂ” these biomes never appear on this terrain.
# Mesa family: badlands whitelist only. Jungle/swamp: plains/dales/steppe OK; blocked on hills+.

