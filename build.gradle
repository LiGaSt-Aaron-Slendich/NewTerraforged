buildscript {
    repositories {
        maven { url = "https://repo.spongepowered.org/maven" }
        maven { url = "https://maven.minecraftforge.net" }
        mavenCentral()
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:5.1.+"
        classpath "org.spongepowered:mixingradle:0.7.32"
    }
}

apply plugin: "net.minecraftforge.gradle"
apply plugin: "org.spongepowered.mixin"
apply plugin: "java"

apply from: "common.gradle"

repositories {
    maven { url = "https://repo.spongepowered.org/maven" }
    mavenCentral()

    flatDir {
        dirs "libs"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"

    // Р СћР вЂ™Р С›Р Р‡ Р В»Р С•Р С”Р В°Р В»РЎРЉР Р…Р В° Р В±РЎвЂ“Р В±Р В»РЎвЂ“Р С•РЎвЂљР ВµР С”Р В° (РЎвЂ Р Вµ РЎвЂљР С‘ РІР‚СљР Р†Р В¶Р Вµ Р С—Р С•РЎвЂћРЎвЂ“Р С”РЎРѓР С‘Р Р†РІР‚Сњ РІР‚вЂќ Р С—Р С•Р Р†Р ВµРЎР‚РЎвЂљР В°РЎР‹ РЎРЏР С” Р В±РЎС“Р В»Р С• Р В»Р С•Р С–РЎвЂ“РЎвЂЎР Р…Р С•)
    implementation files("libs/Terraforged.jar")
}

sourceSets {
    main {
        java {
            srcDirs += "Forge/main/java"
            // Phase4 scope cut: KEEP files deferred until HEAD CarverChunk gains minimal hooks (no DROP).
            exclude "**/CaveEntranceCarver.java"
            exclude "**/CarveDecisionDiagnostics.java"
            // CarverColumnCache / MegaGiga* enabled for footprint activation
            exclude "**/CaveEntranceClaims.java"
            exclude "**/CaveColumnScan.java"
            exclude "**/CaveBreaches.java"
            exclude "**/CaveLocator.java"
            exclude "**/CaveOceanFilter.java"
            exclude "**/CaveOpenAirCheck.java"
            exclude "**/CaveUndergroundGuard.java"
            exclude "**/MegaCaveStructureFilter.java"
            exclude "**/CaveBiomeFeatureRunner.java"
            exclude "**/CaveBiomeFeaturePresets.java"
            exclude "**/CaveBiomeVanillaPass.java"
            exclude "**/CaveBiomeVolumeDecorator.java"
            exclude "**/CaveBiomeDecoratorRouter.java"
            exclude "**/CaveBiomeColumnUnifier.java"
            exclude "**/CaveBiomeVerticalFit.java"
            exclude "**/TerraForgedOfficialCaveDecorator.java"
            exclude "**/CaveFeaturePlan.java"
            exclude "**/CaveFeaturePlacement.java"
            exclude "**/CaveFeatureFilters.java"
            exclude "**/CaveFeatureDiagnostics.java"
            exclude "**/CaveFeatureRules.java"
            exclude "**/CaveFeatureClassifier.java"
            exclude "**/CaveFeatureMass.java"
            exclude "**/ChunkScopedWorldGenLevel.java"
            exclude "**/DynamicTreesCompat.java"
            exclude "**/ProbeNetwork.java"
            exclude "**/internal/probe/**"
            exclude "**/BackgroundSearchTasks.java"
            exclude "**/FeaturePlacement.java"
            exclude "**/CaveSiteTags.java"
            exclude "**/CaveCartography.java"
            exclude "**/ModCaveBiomeFactories.java"
        }
        resources {
            srcDirs += "Forge/main/resources"
        }
    }
}

minecraft {
    mappings channel: "official", version: minecraft_version

    runs {
        client {
            workingDirectory project.file("run")
            property "forge.logging.markers", "REGISTRIES"
            property "forge.logging.console.level", "debug"
            arg "-mixin.config=newterraforged.mixins.json"

            mods {
                newterraforged {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file("run")
            property "forge.logging.markers", "REGISTRIES"
            property "forge.logging.console.level", "debug"
            arg "-mixin.config=newterraforged.mixins.json"

            mods {
                newterraforged {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file("run")
            property "forge.logging.markers", "REGISTRIES"
            property "forge.logging.console.level", "debug"

            args "--mod", "newterraforged", "--server", "--output", file("generated")
            arg "-mixin.config=newterraforged.mixins.json"

            mods {
                newterraforged {
                    source sourceSets.main
                }
            }
        }
    }
}

jar {
    finalizedBy "reobfJar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(project.zipTree("libs/Terraforged.jar")) {
        exclude "META-INF/MANIFEST.MF"
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
        exclude "module-info.class"
    }
    // Mod classes must win over anything bundled from Terraforged.jar
    from(sourceSets.main.output)
    manifest {
        attributes([
                "MixinConfigs": "newterraforged.mixins.json"
        ])
    }
}

mixin {
    add sourceSets.main, "newterraforged.refmap.json"
}